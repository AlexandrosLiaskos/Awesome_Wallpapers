name: Keep scheduled workflows on

# GitHub turns off the scheduled workflows of a public repository after 60 days without activity.
# Enabling them again every month keeps them running without commits. This workflow is scheduled
# too, so it enables itself as well.

on:
  schedule:
    - cron: '23 5 1 * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      # This also turns on again a workflow that was turned off by hand; to keep one off, take it out of this list.
      - run: |
          failed=0
          for workflow in deploy.yml sync.yml keepalive.yml; do
            if ! gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/enable"; then
              echo "::error::Could not enable $workflow."
              failed=1
            fi
          done
          exit "$failed"
        env:
          GH_TOKEN: ${{ github.token }}
