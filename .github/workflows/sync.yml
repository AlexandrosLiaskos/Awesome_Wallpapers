name: Sync collections

# Every day: finds the new, changed and removed files of the indexed collections (scripts/sync.ts)
# and proposes them in one pull request from the branch sync/additions. The branch keeps what
# earlier runs added until the pull request is merged, and is never rewritten, so hand tags pushed
# to it stay. Removals do not wait for the pull request: the scheduled deploys leave gone files out.
#
# The sync job runs the npm packages and reads images from other repositories with a read-only
# token; the publish job, which installs nothing, pushes its commits and opens the pull request.

on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync
  cancel-in-progress: false

env:
  BRANCH: sync/additions

defaults:
  run:
    shell: bash

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
      pending: ${{ steps.commit.outputs.pending }}
      remote-head: ${{ steps.branch.outputs.remote-head }}
    steps:
      # The whole history, to merge main into the branch.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Take up the branch
        id: branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          found=0
          git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" > /dev/null || found=$?
          if [ "$found" -eq 2 ]; then
            git checkout -B "$BRANCH" origin/main
            echo 'state=new' >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$found" -ne 0 ]; then
            echo "::error::Could not ask GitHub whether $BRANCH exists (git ls-remote exited with $found)."
            exit 1
          fi
          git fetch --no-tags origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          echo "remote-head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo 'state=existing' >> "$GITHUB_OUTPUT"
          if ! git merge --no-edit -m "chore: merge main into $BRANCH" origin/main; then
            conflicts=$(git diff --name-only --diff-filter=U | paste -sd ' ' -)
            git merge --abort
            message="Merging main into $BRANCH stopped at a conflict in: $conflicts. Merge main into the branch by hand (or use Resolve conflicts on its pull request), push, then run this workflow again."
            echo "::error::$message"
            printf '## Sync stopped\n\n%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The CLIP model is downloaded on first use, only when there are files to tag.
      - name: Restore the tagger's model
        uses: actions/cache@v6
        with:
          path: .cache/models
          key: clip-${{ hashFiles('scripts/lib/clip.ts') }}

      - name: Sync the collections
        run: node scripts/sync.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Held files fail validation until they are tagged by hand on the pull request, so the result
      # goes into the job summary instead of stopping the job. The tests are the gate.
      - name: Validate the catalog
        id: validate
        continue-on-error: true
        run: npm run validate 2>&1 | tee "$RUNNER_TEMP/validate.log"

      - name: Test
        id: test
        run: npm test

      - name: Commit the changes
        id: commit
        run: |
          git add data/sources/
          if git diff --cached --quiet -- data/sources/; then
            echo 'committed=false' >> "$GITHUB_OUTPUT"
          else
            git commit --quiet -m 'chore: add files from indexed collections' \
              -m "Summary and contact sheets: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo 'committed=true' >> "$GITHUB_OUTPUT"
          fi
          # Whether the branch has files for main, from this run or from earlier ones.
          if git diff --quiet origin/main HEAD -- data/sources/; then
            echo 'pending=false' >> "$GITHUB_OUTPUT"
          else
            echo 'pending=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the contact sheets
        id: sheets
        if: steps.commit.outputs.committed == 'true' || steps.commit.outputs.pending == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: contact-sheets
          path: .cache/review/
          # The folder is inside .cache, which would otherwise count as hidden.
          include-hidden-files: true
          if-no-files-found: error
          # A re-run of the job uploads again under the same name.
          overwrite: true

      - name: Prepare the pull request and the commits
        if: steps.sheets.outcome == 'success'
        env:
          COMMITTED: ${{ steps.commit.outputs.committed }}
          STATE: ${{ steps.branch.outputs.state }}
          SHEETS_URL: ${{ steps.sheets.outputs.artifact-url }}
        run: |
          mkdir -p "$RUNNER_TEMP/publish"
          summary=.cache/review/summary.md
          # GitHub takes at most 65,536 characters in a pull request body.
          limit=60000
          {
            if [ "$(wc -c < "$summary")" -le "$limit" ]; then
              cat "$summary"
            else
              head -c "$limit" "$summary" | sed '$d'
              echo
              echo 'The summary is cut short here; all of it is in summary.md in the artifact below.'
            fi
            echo
            echo "The contact sheets are in [this run's artifact]($SHEETS_URL)."
            echo
            echo 'This pull request can be merged once the Validate check on its latest commit passes; held files need tags first.'
          } > "$RUNNER_TEMP/publish/pull-request.md"
          # Only the commits made here: the publish job fetches main and the branch itself.
          if [ "$COMMITTED" = true ]; then
            known=(^origin/main)
            if [ "$STATE" = existing ]; then known+=("^origin/$BRANCH"); fi
            git bundle create "$RUNNER_TEMP/publish/branch.bundle" "$BRANCH" "${known[@]}"
          fi

      - name: Hand them to the publish job
        if: steps.sheets.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: publish
          path: ${{ runner.temp }}/publish/
          retention-days: 1
          if-no-files-found: error
          overwrite: true

      - name: Write the job summary
        if: ${{ !cancelled() && steps.branch.outcome == 'success' }}
        env:
          STATE: ${{ steps.branch.outputs.state }}
          VALIDATE: ${{ steps.validate.outcome }}
          TEST: ${{ steps.test.outcome }}
          COMMITTED: ${{ steps.commit.outputs.committed }}
        run: |
          {
            echo '## Sync'
            echo
            if [ "$STATE" = new ]; then
              echo "- Branch: $BRANCH, started from main"
            else
              echo "- Branch: $BRANCH, with main merged in"
            fi
            echo "- Catalog validation: $VALIDATE (held files fail it until they are tagged by hand)"
            echo "- Tests: $TEST"
            if [ "$COMMITTED" = true ]; then
              echo '- data/sources/ changed and was committed'
            elif [ "$COMMITTED" = false ]; then
              echo '- data/sources/ did not change'
            fi
            if [ "$VALIDATE" = failure ] && [ -s "$RUNNER_TEMP/validate.log" ]; then
              echo
              echo '<details><summary>Validation output</summary>'
              echo
              echo '```'
              head -n 200 "$RUNNER_TEMP/validate.log"
              echo '```'
              echo
              echo '</details>'
            fi
            if [ -f .cache/review/summary.md ]; then
              echo
              cat .cache/review/summary.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: sync
    if: needs.sync.outputs.committed == 'true' || needs.sync.outputs.pending == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: publish
          path: ${{ runner.temp }}/publish

      # The whole history: the commits from the sync job build on main and the branch.
      - uses: actions/checkout@v7
        if: needs.sync.outputs.committed == 'true'
        with:
          fetch-depth: 0

      # Without force: when the branch moved during the run (new hand tags), the push is refused
      # and the next run starts from the moved branch.
      - name: Push the branch
        id: push
        if: needs.sync.outputs.committed == 'true'
        run: |
          git fetch --no-tags "$RUNNER_TEMP/publish/branch.bundle" "refs/heads/$BRANCH"
          sha=$(git rev-parse FETCH_HEAD)
          if ! git push origin "$sha:refs/heads/$BRANCH" 2> "$RUNNER_TEMP/push.log"; then
            cat "$RUNNER_TEMP/push.log" >&2
            if grep -q 'workflows' "$RUNNER_TEMP/push.log"; then
              message="GitHub refused the push: main changed files in .github/workflows since $BRANCH last took it in, and this workflow's token may not push such changes. Use Update branch on the pull request (or merge main into $BRANCH and push), then run this workflow again."
            else
              message="Pushing $BRANCH failed. If the branch changed while this workflow ran, run it again."
            fi
            echo "::error::$message"
            printf '## Publish stopped\n\n%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat "$RUNNER_TEMP/push.log"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "- Pushed $BRANCH at $sha" >> "$GITHUB_STEP_SUMMARY"

      # Edited when this run pushed. Opened when there is none: after new files, or when an earlier
      # run pushed but could not open it. One closed at the branch's current commit is left closed.
      - name: Open or update the pull request
        id: pull-request
        env:
          COMMITTED: ${{ needs.sync.outputs.committed }}
          PENDING: ${{ needs.sync.outputs.pending }}
          HEAD_SHA: ${{ steps.push.outputs.sha || needs.sync.outputs.remote-head }}
          TITLE: Additions from indexed collections
        run: |
          body="$RUNNER_TEMP/publish/pull-request.md"
          pulls=$(gh api "repos/$GITHUB_REPOSITORY/pulls?head=$GITHUB_REPOSITORY_OWNER:$BRANCH&base=main&state=all&per_page=100")
          open=$(jq -r 'map(select(.state == "open")) | .[0].number // empty' <<< "$pulls")
          seen=$(jq --arg sha "$HEAD_SHA" 'any(.[]; .head.sha == $sha)' <<< "$pulls")
          if [ -n "$open" ]; then
            if [ "$COMMITTED" != true ]; then
              echo "- Pull request #$open already has the branch's files" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            url=$(gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$open" -f title="$TITLE" -F body=@"$body" --jq .html_url)
          elif [ "$PENDING" = true ] && { [ "$COMMITTED" = true ] || [ "$seen" = false ]; }; then
            url=$(gh api "repos/$GITHUB_REPOSITORY/pulls" -f title="$TITLE" -f head="$BRANCH" -f base=main -F body=@"$body" --jq .html_url)
          else
            echo '- No pull request to open or update' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "- Pull request: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Explain a refused pull request
        if: failure() && steps.pull-request.outcome == 'failure'
        run: |
          message="If GitHub answered that Actions may not create pull requests, turn on \"Allow GitHub Actions to create and approve pull requests\" in Settings, Actions, General. The next run opens the pull request for what is already on $BRANCH."
          echo "::error::$message"
          echo "- $message" >> "$GITHUB_STEP_SUMMARY"

      # A push or pull request made with this workflow's token starts no checks, so Validate is
      # started here, on the branch's latest commit.
      - name: Run Validate on the branch
        if: ${{ !cancelled() && (steps.push.outcome == 'success' || steps.pull-request.outputs.url != '') }}
        run: |
          gh workflow run validate.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          echo '- Started Validate on the branch' >> "$GITHUB_STEP_SUMMARY"
