name: Deploy

# Builds the site and publishes it to GitHub Pages on every push to main, and every six hours so
# that files gone from the indexed collections leave the site without anyone. A scheduled run
# publishes only when the catalog it built differs from the live one, or when no run of the same
# commit has published yet.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits for the running one to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To look up earlier deploys of the same commit (see "Compare with the live site").
      actions: read
    outputs:
      deploy: ${{ steps.live.outputs.skip != 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The build needs none of the devDependencies (tests, type checks, the tagger's model
      # runtime); every pull request runs the tests in validate.yml.
      - run: npm ci --omit=dev

      - run: npm run validate

      # Thumbnails and previews are rebuilt only for images that changed.
      - name: Restore generated images
        uses: actions/cache@v6
        with:
          path: |
            .cache
            public/m
          key: media-v2-${{ hashFiles('images/**', 'data/sources/**', 'scripts/lib/media.ts') }}
          restore-keys: media-v2-

      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # A scheduled run skips the deploy only when the catalog is the live one and a run of this
      # commit already deployed: a scheduled run can displace a pending push run of the same commit,
      # whose code changes would otherwise never go live. A live catalog or an earlier run that
      # cannot be looked up counts as a difference, so the run deploys.
      - name: Compare with the live site
        id: live
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          built=$(sha256sum dist/api/wallpapers.json)
          built=${built%% *}
          live=unknown
          if curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            --output "$RUNNER_TEMP/live.json" https://wallpapers.liaskos.eu/api/wallpapers.json; then
            live=$(sha256sum "$RUNNER_TEMP/live.json")
            live=${live%% *}
          else
            echo "::warning::The live catalog could not be fetched, so this run deploys."
          fi
          skip=false
          if [ "$built" = "$live" ]; then
            if runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --commit "$GITHUB_SHA" \
              --status success --json databaseId --jq length); then
              if [ "$runs" -gt 0 ] 2> /dev/null; then
                skip=true
              else
                echo "No earlier run deployed $GITHUB_SHA, so this run deploys."
              fi
            else
              echo "::warning::Earlier runs of $GITHUB_SHA could not be looked up, so this run deploys."
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          if [ "$skip" = true ]; then
            echo 'The catalog is the same as the live one and this commit was deployed before, so nothing was deployed.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-pages-artifact@v5
        if: steps.live.outputs.skip != 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
