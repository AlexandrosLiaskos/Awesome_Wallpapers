name: Deploy

# Builds the site and publishes it to GitHub Pages on every push to main, and every six hours so
# that files gone from the indexed collections leave the site without anyone. A scheduled run
# publishes only when the catalog it built differs from the live one.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits for the running one to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.live.outputs.same != 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The build needs none of the devDependencies (tests, type checks, the tagger's model
      # runtime); every pull request runs the tests in validate.yml.
      - run: npm ci --omit=dev

      - run: npm run validate

      # Thumbnails and previews are rebuilt only for images that changed.
      - name: Restore generated images
        uses: actions/cache@v6
        with:
          path: |
            .cache
            public/m
          key: media-v2-${{ hashFiles('images/**', 'data/sources/**', 'scripts/lib/media.ts') }}
          restore-keys: media-v2-

      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # A live catalog that cannot be fetched counts as different, so the run deploys.
      - name: Compare with the live catalog
        id: live
        if: github.event_name == 'schedule'
        run: |
          built=$(sha256sum dist/api/wallpapers.json)
          built=${built%% *}
          live=unknown
          if curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            --output "$RUNNER_TEMP/live.json" https://wallpapers.liaskos.eu/api/wallpapers.json; then
            live=$(sha256sum "$RUNNER_TEMP/live.json")
            live=${live%% *}
          else
            echo "::warning::The live catalog could not be fetched, so this run deploys."
          fi
          if [ "$built" = "$live" ]; then
            echo 'same=true' >> "$GITHUB_OUTPUT"
            echo 'The catalog is the same as the live one, so nothing was deployed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'same=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-pages-artifact@v5
        if: steps.live.outputs.same != 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
