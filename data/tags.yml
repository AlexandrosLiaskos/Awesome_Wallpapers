# The tags a wallpaper may use. A tag that is not listed here fails validation.
#
#   slug:        what goes in wallpapers.yml and in the tag's address
#   label:       how the tag is written on the site
#   kind:        palette (a named colour scheme) or subject (what it shows, or its style)
#   description: one sentence for the tag's page
#   swatch:      the colour shown next to a palette tag

# Palettes

- slug: nord
  label: Nord
  kind: palette
  description: Wallpapers in the cool, arctic blue-greys of the Nord colour scheme.
  swatch: "#88c0d0"

- slug: gruvbox
  label: Gruvbox
  kind: palette
  description: Warm, retro wallpapers in the earthy tones of the Gruvbox colour scheme.
  swatch: "#d79921"

- slug: catppuccin
  label: Catppuccin
  kind: palette
  description: Soft pastel wallpapers in the Catppuccin colour scheme.
  swatch: "#cba6f7"

- slug: tokyo-night
  label: Tokyo Night
  kind: palette
  description: Wallpapers in the deep blues and neon accents of the Tokyo Night colour scheme.
  swatch: "#7aa2f7"

- slug: everforest
  label: Everforest
  kind: palette
  description: Calm green wallpapers in the Everforest colour scheme.
  swatch: "#a7c080"

